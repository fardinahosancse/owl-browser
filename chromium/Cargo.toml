[package]
name = "owl-chromium"
version = "0.0.1"
edition = "2021"
publish = false
description = "Experimental: Owl. on the Chromium Embedded Framework (CEF) instead of Edge WebView2"
license = "MIT"

# A separate crate on purpose: the shipping Owl. build (WebView2) is untouched while this
# experiment is evaluated. Build it with `cargo build --release` from this folder; it needs the
# MSVC toolchain and CMake (see README.md here).

[[bin]]
name = "owl-chromium"
path = "src/main.rs"

[dependencies]
# Pinned to one CEF release: the crate version carries the CEF version (156.0.31 = Chromium 156).
# Without the "sandbox" feature the renderer sandbox is off; see README.md for what that means.
cef = { version = "=156.7.0", default-features = false }
# OwlKick: the same blocker engine as the WebView2 build
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item target\release\owl.exe
          "owl.exe is $([math]::Round($f.Length / 1MB, 2)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: owl-windows-x64
          path: target/release/owl.exe
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Installer script compiles
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: owl-windows-x64
          path: staged

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item staged\owl.exe dist\Owl.exe
          $env:OWL_VERSION = "0.0.0-ci"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\owl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

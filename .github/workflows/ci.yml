name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check
        run: cargo check --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      # drives the real executable: first-run setup, a fast download with checksum, Data saver,
      # Save image as, and the seal that runs when Windows shuts down
      - name: Smoke test (real app)
        shell: pwsh
        run: scripts/smoke-test.ps1 -Exe target\release\owl.exe -Seconds 90

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item target\release\owl.exe
          "owl.exe is $([math]::Round($f.Length / 1MB, 2)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owl-windows-x64
          path: target/release/owl.exe
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Installer builds, installs and uninstalls
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: owl-windows-x64
          path: staged

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item staged\owl.exe dist\Owl.exe
          $env:OWL_VERSION = "0.0.0-ci"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\owl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # silent per-user install, check the files, shortcut entry and uninstaller, then uninstall
      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\Owl-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Owl"
          if (-not (Test-Path (Join-Path $dir "Owl.exe"))) { throw "Owl.exe was not installed in $dir" }
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $un) { throw "no uninstaller was installed" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { $_.PSChildName -like "*7C3B6F52*" }
          if (-not $key) { throw "no Apps and features entry was registered" }
          $p = Start-Process $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          Start-Sleep 5
          if (Test-Path (Join-Path $dir "Owl.exe")) { throw "Owl.exe is still there after uninstall" }
          "Silent install and uninstall passed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1

  deny:
    name: Licences and sources (cargo-deny)
    runs-on: ubuntu-latest
    # advisory only until the first clean run confirms the allow-list
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

name: Chromium preview (CEF)

# Builds the experimental Owl. on Chromium (chromium/) on the branch that carries it. It needs
# MSVC and CMake, which GitHub's Windows runners have, and downloads the CEF binary distribution
# (about 150 MB) that the cef crate is pinned to.

on:
  push:
    branches: [chromium-cef]
    paths: ["chromium/**", ".github/workflows/chromium.yml", "assets/**", "src/ui.html", "chrome-extension-homepage/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and launch (Windows, CEF)
    runs-on: windows-latest
    env:
      CEF_PATH: ${{ github.workspace }}\cef-dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: chromium

      - name: Build
        working-directory: chromium
        run: cargo build --release

      - name: Stage the sandboxed layout (bootstrap exe + Owl. DLL + Chromium runtime)
        shell: pwsh
        run: |
          $out = "stage\owl-chromium"; New-Item -ItemType Directory $out -Force | Out-Null
          $lib = Get-ChildItem $env:CEF_PATH -Recurse -Filter libcef.dll | Select-Object -First 1
          if (-not $lib) { throw "libcef.dll not found under $env:CEF_PATH" }
          $rel = $lib.DirectoryName
          # CEF's bootstrap sets up the sandbox and loads the DLL with its own name
          Copy-Item (Join-Path $rel "bootstrap.exe") "$out\owl-chromium.exe"
          Copy-Item chromium\target\release\owl_chromium.dll "$out\owl-chromium.dll"
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in ".dll", ".bin", ".json" -and $_.Name -notlike "bootstrap*" } | Copy-Item -Destination $out
          $res = Get-ChildItem $env:CEF_PATH -Recurse -Filter icudtl.dat | Select-Object -First 1
          Get-ChildItem $res.DirectoryName -File | Copy-Item -Destination $out
          if (Test-Path (Join-Path $res.DirectoryName "locales")) { Copy-Item (Join-Path $res.DirectoryName "locales") "$out\locales" -Recurse -Force }
          # Owl. Calm Home, the home and new tab page, loaded by Owl. from the "home" folder
          New-Item -ItemType Directory "$out\home" -Force | Out-Null
          Get-ChildItem chrome-extension-homepage -Exclude screenshots, windows-helper, README.md, .gitignore, .gitattributes | Copy-Item -Destination "$out\home" -Recurse -Force
          # the Owl. icon and name on the executable
          npm install --no-save --silent rcedit@4.0.1 | Out-Null
          & node_modules\rcedit\bin\rcedit-x64.exe "$out\owl-chromium.exe" --set-icon assets\owl.ico --set-version-string ProductName "Owl." --set-version-string FileDescription "Owl. (Chromium preview)" --set-version-string CompanyName "Owl."
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed" }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          $mb = [math]::Round(((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "owl-chromium.dll is $([math]::Round((Get-Item "$out\owl-chromium.dll").Length / 1MB, 2)) MB; with the Chromium runtime $mb MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Diagnose start-up
        shell: pwsh
        continue-on-error: true
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "owl-cef-diag"; New-Item -ItemType Directory $env:LOCALAPPDATA -Force | Out-Null
          $env:OWL_CEF_TRACE = Join-Path $env:RUNNER_TEMP "owl-cef-trace.txt"
          $d = "stage\owl-chromium"
          $rel = (Get-ChildItem $env:CEF_PATH -Recurse -Filter libcef.dll | Select-Object -First 1).DirectoryName
          Copy-Item (Join-Path $rel "bootstrapc.exe") "$d\owl-chromium-c.exe"; Copy-Item "$d\owl-chromium.dll" "$d\owl-chromium-c.dll"
          foreach ($combo in @("1,1,default", "0,1,default", "1,0,default", "1,1,alloy", "0,0,default")) {
            $f, $b, $w = $combo -split ","
            $env:OWL_FRAMELESS = $f; $env:OWL_BOX = $b; $env:OWL_WSTYLE = $w
            Remove-Item $env:OWL_CEF_TRACE -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:LOCALAPPDATA "Owl") -Recurse -Force -ErrorAction SilentlyContinue
            $e = Join-Path $env:RUNNER_TEMP "c.err.txt"
            $p = Start-Process "$d\owl-chromium-c.exe" -ArgumentList "--enable-logging=stderr","--v=0" -PassThru -RedirectStandardError $e
            Start-Sleep 15; $p.Refresh()
            $last = (Get-Content $env:OWL_CEF_TRACE -ErrorAction SilentlyContinue | Select-String "shell:" | Select-Object -Last 1)
            "combo frameless=$f box=$b style=$w : running=$(-not $p.HasExited) exit=$(if ($p.HasExited) { '0x{0:X8}' -f $p.ExitCode }) last=[$last]"
            Get-Content $e -ErrorAction SilentlyContinue | Select-String "FATAL|Check failed|PANIC" | Select-Object -First 3 | ForEach-Object { "    $_" }
            Get-Process owl-chromium* -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          }
          Remove-Item Env:OWL_FRAMELESS, Env:OWL_BOX, Env:OWL_WSTYLE -ErrorAction SilentlyContinue
          Remove-Item "$d\owl-chromium-c.*" -ErrorAction SilentlyContinue

      - name: Launch check
        shell: pwsh
        run: |
          # starts Chromium with a throwaway profile, waits, and checks it is still running and wrote its profile
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "owl-cef-profile"
          New-Item -ItemType Directory $env:LOCALAPPDATA -Force | Out-Null
          # first start writes the profile and Owl.'s settings; the second start shows them applied
          $p = Start-Process stage\owl-chromium\owl-chromium.exe -PassThru -RedirectStandardError (Join-Path $env:RUNNER_TEMP "cef-err1.txt")
          Start-Sleep 20
          Get-Process owl-chromium -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 3
          $root = Join-Path $env:LOCALAPPDATA "Owl\chromium"
          $ls = Get-Content (Join-Path $root "Local State") -Raw -ErrorAction SilentlyContinue
          $pf = Get-ChildItem $root -Recurse -Filter Preferences -ErrorAction SilentlyContinue | Select-Object -First 1
          $pr = if ($pf) { Get-Content $pf.FullName -Raw } else { "" }
          "Secure DNS saved: $([bool]($ls -match 'cloudflare-dns.com')); mode secure: $([bool]($ls -match '\"mode\":\"secure\"'))" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Theme colour saved: $([bool]($pr -match 'user_color')); home page saved: $([bool]($pr -match 'home.html'))" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content (Join-Path $env:RUNNER_TEMP "cef-err1.txt") -ErrorAction SilentlyContinue | Select-String "preference" | ForEach-Object { "  $_" }
          $p = Start-Process stage\owl-chromium\owl-chromium.exe -PassThru
          Start-Sleep 20
          # a screenshot of the window, for the artifact
          Add-Type -AssemblyName System.Drawing
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r);[DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h,int c);public struct RECT{public int L,T,R,B;}' -Name W -Namespace CI
          $w = Get-Process owl-chromium -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          if ($w) {
            [CI.W]::ShowWindow($w.MainWindowHandle, 3) | Out-Null; Start-Sleep 3
            $r = New-Object CI.W+RECT; [CI.W]::GetWindowRect($w.MainWindowHandle, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T); $g = [System.Drawing.Graphics]::FromImage($bmp); $dc = $g.GetHdc()
            [CI.W]::PrintWindow($w.MainWindowHandle, $dc, 2) | Out-Null; $g.ReleaseHdc($dc); $g.Dispose()
            New-Item -ItemType Directory shots -Force | Out-Null; $bmp.Save("shots\owl-chromium.png"); $bmp.Dispose()
            "window title: $($w.MainWindowTitle)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          $cl = Get-CimInstance Win32_Process -Filter "Name='owl-chromium.exe'" | Select-Object -ExpandProperty CommandLine
          $kidsCl = $cl | Where-Object { $_ -match '--type=' }
          $unsandboxed = ($kidsCl | Where-Object { $_ -match '--no-sandbox' }).Count
          "child processes: $($kidsCl.Count); without sandbox: $unsandboxed" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $kidsCl | ForEach-Object { "  " + (($_ -split ' ') | Where-Object { $_ -match '^--type=' }) }
          if ($unsandboxed -gt 0) { throw "some Chromium processes run without the sandbox" }
          $p.Refresh()
          $alive = -not $p.HasExited
          $kids = (Get-Process owl-chromium -ErrorAction SilentlyContinue | Measure-Object).Count
          $prof = Test-Path (Join-Path $env:LOCALAPPDATA "Owl\chromium")
          "alive=$alive processes=$kids profile=$prof" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Process owl-chromium -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { throw "owl-chromium exited early with code $($p.ExitCode)" }
          if (-not $prof) { throw "no Chromium profile was created" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: owl-chromium-screenshot
          path: shots
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owl-chromium-preview-windows-x64
          path: stage/owl-chromium
          if-no-files-found: error
          retention-days: 14

# cargo-deny policy: advisories, licences and sources for Owl's dependency tree.
[graph]
# Owl ships for Windows only; Linux-only crates (glib, gtk) are not part of the build.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
